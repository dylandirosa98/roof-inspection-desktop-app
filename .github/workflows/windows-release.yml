name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails and NSIS
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install nsis --no-progress --yes
          $nsisPath = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS") | Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if ($null -eq $nsisPath) { throw "makensis.exe was not installed." }
          $env:Path = "$nsisPath;$env:Path"
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build installer
        shell: pwsh
        run: |
          wails build -platform windows/amd64 -nsis -webview2 embed
          $installer = Get-ChildItem build/bin/*installer.exe | Select-Object -First 1
          if ($null -eq $installer) { throw "Windows installer was not created." }
          Copy-Item $installer.FullName build/bin/Spartan-Roof-Inspection-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Spartan-Roof-Inspection-Setup
          path: build/bin/Spartan-Roof-Inspection-Setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/Spartan-Roof-Inspection-Setup.exe
